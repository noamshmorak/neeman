:root{

.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}

    doc(path){ return { path, get:async()=>snapDoc(path), set:async(data)=>{ store[path]=JSON.parse(JSON.stringify(data)); persist(); emit(); }, update:async(data)=>{ store[path]={...(store[path]||{}),...data}; persist(); emit(); }, delete:async()=>{ delete store[path]; persist(); emit(); }, onSnapshot:(fn)=>sub("doc",path,fn) }; },

  };
  async function toB64(blob){

  }
  function parseJson(t){ try{return JSON.parse(t);}catch(e){} const m=t.match(/```(?:json)?\s*([\s\S]*?)```/); if(m){try{return JSON.parse(m[1]);}catch(e){}} const a=t.indexOf("{"), b=t.lastIndexOf("}"); if(a>=0&&b>a){try{return JSON.parse(t.slice(a,b+1));}catch(e){}} throw {code:"invalid_json",message:"bad json",text:t}; }

  const sample={
    limits:async()=>({maxPromptBytes:262144,images:{maxCount:10,maxInputBytes:20e6,mediaTypes:["image/jpeg","image/png","image/webp"]}}),

      let r;
      try{ r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",signal:opts.signal,headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:getModel(),max_tokens:12000,messages:[{role:"user",content}]})}); }
      catch(e){ if(e.name==="AbortError") throw {code:"cancelled",message:"cancelled"}; throw {code:"network",message:String(e)}; }
      if(!r.ok){ const txt=await r.text().catch(()=> ""); throw {code:r.status===401?"bad_key":r.status===429?"rate_limited":r.status===404||/model/i.test(txt)&&r.status===400?"bad_model":"upstream_error",message:txt}; }
      const j=await r.json(); const t=(j.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("");
      return parseJson(t);
    }
  };
  const downloads={ save:async({filename,data})=>{ const blob=data instanceof Blob?data:new Blob([data]); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename; document.body.append(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000); return {status:"saved"}; } };
  window.claude={ use:async(name)=>({db,sample,downloads}[name]||null) };
  window.LOCAL={
    panel(){ const k=getKey(); return `<div class="panel"><h3>קריאת צילומים ו-PDF</h3>
      <p class="muted">הקובץ עובד בלי Claude. כדי שהמערכת תקרא צילומי חשבוניות צריך מפתח API של Anthropic (נפתח ב-platform.claude.com, משלמים לפי שימוש, בערך 20 אגורות לחשבונית מצולמת עם Sonnet). אקסל והקלדה ידנית עובדים גם בלי מפתח.</p>

  };

  fin.onchange=async()=>{ const f=fin.files[0]; fin.value=""; if(!f) return; try{ const d=JSON.parse(await f.text()); if(typeof d!=="object"||!d) throw 0; store=d; persist(); emit(); toastL("הנתונים שוחזרו"); }catch(e){ toastL("קובץ הגיבוי לא תקין"); } };
  document.addEventListener("DOMContentLoaded",()=>document.body.append(fin));
  function toastL(m){ const t=document.createElement("div"); t.className="toast"; t.textContent=m; document.body.append(t); setTimeout(()=>t.remove(),2800); }
  document.addEventListener("click",e=>{
    const b=e.target.closest("[data-act]"); if(!b) return; const a=b.dataset.act;
    if(a==="lsavekey"){ const v=document.getElementById("lKey").value.trim(); try{ if(v&&!v.startsWith("••")) localStorage.setItem(APIKEY,v); localStorage.setItem(MODELKEY,document.getElementById("lModel").value||"claude-sonnet-5-5"); }catch(err){} toastL("נשמר"); setTimeout(()=>location.reload(),600); }
    if(a==="ltestkey"){ b.disabled=true; b.textContent="בודק…"; sample.json('Reply with only this JSON: {"ok":true}').then(r=>{ toastL(r&&r.ok?"החיבור עובד. אפשר לקרוא צילומים.":"התקבלה תשובה לא צפויה"); }).catch(e=>{ toastL(e.code==="bad_key"?"המפתח לא תקין":e.code==="bad_model"?"שם המודל לא מוכר":e.code==="network"?"אין חיבור לאינטרנט":e.code==="rate_limited"?"אין יתרה בחשבון או יותר מדי בקשות":"שגיאה: "+(e.message||e.code).slice(0,120)); }).finally(()=>{ b.disabled=false; b.textContent="בדוק חיבור"; }); }
    if(a==="lclearkey"){ try{localStorage.removeItem(APIKEY);}catch(err){} toastL("המפתח נמחק"); location.reload(); }

<script>
"use strict";
document.documentElement.lang = "he";
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const n = v => { const x = parseFloat(String(v ?? "").replace(/[,₪\s]/g, "")); return isFinite(x) ? x : 0; };
const nn = v => { if (v === null || v === undefined || v === "") return null; const x = n(v); return isFinite(x) ? x : null; };
const money = (v, d = 2) => v == null || !isFinite(v) ? "—" : "₪" + v.toLocaleString("he-IL", { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (v, d = 1) => v == null || !isFinite(v) ? "—" : (v * 100).toFixed(d) + "%";
const today = () => new Date().toISOString().slice(0, 10);
const norm = s => String(s || "").replace(/["'״׳\-\.\,\(\)]/g, " ").replace(/\s+/g, " ").trim().toLowerCase();
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const cleanBarcode = b => { const d = String(b ?? "").replace(/\D/g, ""); return d.length >= 7 && d.length <= 14 ? d : ""; };
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.append(t); setTimeout(() => t.remove(), 2800); }
const fmtDate = d => d ? d.split("-").reverse().join("/") : "—";

/* ---------- state ---------- */
const DEF = { vat: 18, margin: 30, rounding: "90", alertPct: 1, cheaperPct: 2 };
const S = { settings: { ...DEF }, suppliers: {}, products: {}, purchases: [], quotes: [], changes: [], ready: false };
let IDX = {};
let db = null, sample = null, downloads = null;
let view = "inbox";
let draft = null;          // inbox working state
let posMap = null;         // POS import working state

/* ---------- money logic ---------- */
const vatF = () => 1 + (n(S.settings.vat) || 0) / 100;
function roundPrice(x) {
  const r = S.settings.rounding;
  if (!isFinite(x) || x <= 0) return null;
  if (r === "90") { const f = Math.floor(x); let c = f + 0.9; if (c < x - 1e-9) c = f + 1.9; return +c.toFixed(2); }
  if (r === "int") return Math.ceil(x - 1e-9);
  if (r === "10ag") return Math.ceil(x * 10 - 1e-9) / 10;
  return +x.toFixed(2);
}
/* doc discount as percent of the pre-VAT total */
function docDiscPct(doc, grossExVat) {
  const d = doc.docDiscount || {};
  if (!d.type || d.type === "none" || !n(d.value)) return 0;
  if (d.type === "pct") return n(d.value);
  const base = d.onVat === "after" ? grossExVat * vatF() : grossExVat;
  return base > 0 ? (n(d.value) / base) * 100 : 0;
}
/* compute effective per-unit cost (ex VAT) for all lines of a document. Bonus lines of the same product share the cost. */
function computeDoc(doc, sup) {
  const vf = vatF();
  const rebate = n(sup?.rebatePct) / 100;
  let grossAll = 0;
  const L = doc.lines.map(l => {
    let price = n(l.unitPrice); if (doc.pricesIncludeVat) price /= vf;
    const gross = n(l.qty) * price * (1 - n(l.lineDiscountPct) / 100);
    grossAll += gross;
    return { l, gross, units: (n(l.qty) + n(l.freeQty)) * (n(l.packSize) || 1), printedNet: price };
  });
  const dd = docDiscPct(doc, grossAll) / 100;
  const groups = {};
  L.forEach((x, i) => { const k = x.l.pid || cleanBarcode(x.l.barcode) || norm(x.l.name) || "i" + i; (groups[k] ||= { net: 0, units: 0, idx: [] }); groups[k].net += x.gross * (1 - dd) * (1 - rebate); groups[k].units += x.units; groups[k].idx.push(i); });
  const eff = new Array(L.length).fill(null);
  for (const g of Object.values(groups)) { const e = g.units > 0 ? g.net / g.units : null; g.idx.forEach(i => eff[i] = e); }
  const printedUnit = L.map(x => x.printedNet / (n(x.l.packSize) || 1));
  const sumCalc = grossAll * (1 - dd);
  return { eff, printedUnit, grossAll, docDiscPct: dd * 100, totalExVat: sumCalc, totalWithVat: sumCalc * vf };
}

function buildIdx() {
  IDX = {};
  const add = (pid, rec, k) => { (IDX[pid] ||= { inv: [], q: [] })[k].push(rec); };
  for (const p of S.purchases) (p.lines || []).forEach(l => { if (l.pid && l.eff > 0) add(l.pid, { sup: p.supplierId, date: p.date || "", at: p.createdAt || 0, eff: l.eff, doc: p.id, docNo: p.docNo, unitPrice: n(l.unitPrice), qty: n(l.qty), free: n(l.freeQty), pack: n(l.packSize) || 1, disc: n(l.lineDiscountPct) }, "inv"); });
  for (const q of S.quotes) (q.lines || []).forEach(l => { if (l.pid && l.eff > 0) add(l.pid, { sup: q.supplierId, date: q.date || "", at: q.createdAt || 0, eff: l.eff, doc: q.id, validUntil: q.validUntil || "", unitPrice: n(l.unitPrice), qty: n(l.qty), free: n(l.freeQty), pack: n(l.packSize) || 1, disc: n(l.lineDiscountPct) }, "q"); });
  const ord = (a, b) => (b.date || "").localeCompare(a.date || "") || (b.at - a.at);
  for (const v of Object.values(IDX)) { v.inv.sort(ord); v.q.sort(ord); }
}
const supName = id => S.suppliers[id]?.name || "ספק לא ידוע";

function stats(pid) {
  const p = S.products[pid] || {}; const ix = IDX[pid] || { inv: [], q: [] };
  const cur = ix.inv[0] || null;
  const prevSame = cur ? ix.inv.find(r => r !== cur && r.sup === cur.sup) : null;
  const lastBySup = {}; for (const r of ix.inv) if (!lastBySup[r.sup]) lastBySup[r.sup] = r;
  const qBySup = {}; for (const r of ix.q) if (!qBySup[r.sup] && !(r.validUntil && r.validUntil < today())) qBySup[r.sup] = r;
  const offers = [...Object.values(lastBySup).map(r => ({ ...r, kind: "inv" })), ...Object.values(qBySup).map(r => ({ ...r, kind: "q" }))];
  const best = offers.reduce((a, b) => (!a || b.eff < a.eff ? b : a), null);
  const vf = vatF();
  const target = (p.targetMargin != null && p.targetMargin !== "" ? n(p.targetMargin) : n(S.settings.margin)) / 100;
  const cost = cur?.eff ?? (best?.eff ?? null);
  const sell = nn(p.sellPrice);
  const sellEx = sell ? sell / vf : null;
  const margin = sellEx && cost ? (sellEx - cost) / sellEx : null;
  const rec = cost ? roundPrice(cost / (1 - target) * vf) : null;
  const change = cur && prevSame ? cur.eff / prevSame.eff - 1 : null;
  const alerts = [];
  if (cost && !sell) alerts.push({ t: "noprice", sev: "warn", txt: `אין מחיר מכירה. עלות ליחידה ${money(cost)} לפני מע"מ, מחיר מומלץ ${money(rec)}.` });
  if (margin != null && margin < target - 0.005) alerts.push({ t: "margin", sev: "bad", txt: `הרווח ירד ל-${pct(margin)} (היעד ${pct(target, 0)}). מחיר מומלץ לצרכן ${money(rec)} במקום ${money(sell)}.` });
  if (change != null && change * 100 > n(S.settings.alertPct)) alerts.push({ t: "up", sev: "warn", txt: `${supName(cur.sup)} העלה מחיר ב-${pct(change)}: מ-${money(prevSame.eff)} ל-${money(cur.eff)} ליחידה (עלות אמיתית).` });
  if (cur && best && best.sup !== cur.sup && best.eff < cur.eff * (1 - n(S.settings.cheaperPct) / 100)) alerts.push({ t: "cheaper", sev: "info", txt: `אצל ${supName(best.sup)} זה עולה ${money(best.eff)} ליחידה${best.kind === "q" ? " (לפי הצעת מחיר)" : ""}, חיסכון של ${pct(1 - best.eff / cur.eff)} לעומת ${supName(cur.sup)}.` });
  return { p, ix, cur, prevSame, offers, best, target, cost, sell, margin, rec, change, alerts };
}
function allAlerts() {
  const out = [];
  for (const pid of Object.keys(S.products)) { const s = stats(pid); s.alerts.forEach(a => out.push({ ...a, pid, s })); }
  const rank = { bad: 0, warn: 1, info: 2 };
  return out.sort((a, b) => rank[a.sev] - rank[b.sev]);
}

/* ---------- data layer ---------- */
async function put(path, data) { if (!db) throw new Error("no db"); await db.doc(path).set(JSON.parse(JSON.stringify(data))); }
async function del(path) { await db.doc(path).delete(); }
function subscribe() {
  let got = 0; const need = 5; const timer = setTimeout(() => { if (!S.ready) setStatus("הנתונים עדיין לא נטענו. בדוק חיבור."); }, 10000);
  const done = () => { if (++got === need) { S.ready = true; clearTimeout(timer); setStatus(""); } };
  const once = f => { let d = false; return s => { f(s); if (!d) { d = true; done(); } refresh(); }; };
  const err = e => setStatus("שגיאת נתונים: " + (e?.code || ""));
  db.doc("settings/main").onSnapshot(once(s => { S.settings = { ...DEF, ...(s.exists ? s.data() : {}) }; }), err);
  db.collection("suppliers").onSnapshot(once(s => { S.suppliers = {}; s.docs.forEach(d => S.suppliers[d.id] = { id: d.id, ...d.data() }); }), err);
  db.collection("products").onSnapshot(once(s => { S.products = {}; s.docs.forEach(d => S.products[d.id] = { id: d.id, ...d.data() }); }), err);
  db.collection("purchases").onSnapshot(once(s => { S.purchases = s.docs.map(d => ({ id: d.id, ...d.data() })); }), err);
  db.collection("quotes").onSnapshot(once(s => { S.quotes = s.docs.map(d => ({ id: d.id, ...d.data() })); }), err);
  db.collection("pricechanges").onSnapshot(s => { S.changes = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => b.at - a.at); refresh(); }, err);
}
function setStatus(t) { $("#status").textContent = t; }
let rq = 0;
function refresh() {
  cancelAnimationFrame(rq);
  rq = requestAnimationFrame(() => {
    buildIdx();
    const c = allAlerts().filter(a => a.sev !== "info").length;
    const b = $("#badge"); b.hidden = !c; b.textContent = c;
    if (view !== "inbox" || !draft || draft.stage === "pick") render();
  });
}

/* ---------- routing ---------- */
const VIEWS = ["inbox", "alerts", "products", "compare", "quotes", "suppliers", "invoices", "setup"];
function route() { const h = location.hash.slice(1); view = VIEWS.includes(h) ? h : "inbox"; document.querySelectorAll("#tabs a").forEach(a => a.classList.toggle("on", a.dataset.v === view)); render(); }
window.addEventListener("hashchange", route);
function go(v) { if (location.hash !== "#" + v) location.hash = v; else route(); }

function render() {
  const el = $("#view");
  const R = { inbox: vInbox, alerts: vAlerts, products: vProducts, compare: vCompare, quotes: vQuotes, suppliers: vSuppliers, invoices: vInvoices, setup: vSetup }[view];
  el.innerHTML = R();
  after[view]?.();
}
const after = {};
const demoNote = () => Object.values(S.products).some(p => p.demo) ? `<div class="note">כרגע מוצגים <b>נתוני דוגמה</b> (מסומנים "דוגמה"). אפשר למחוק אותם בלשונית הגדרות כשמתחילים לעבוד עם נתונים אמיתיים.</div>` : "";
const emptyMsg = (t, s) => `<div class="panel" style="text-align:center;align-items:center"><h3>${t}</h3><p class="muted">${s}</p></div>`;

/* ---------- INBOX ---------- */
function newDraft(kind) { return { stage: "pick", kind: kind || "invoice", supplierId: "", files: [], excel: null, busy: false }; }
function supOptions(sel, withAuto = true) {
  const opts = Object.values(S.suppliers).sort((a, b) => (a.name || "").localeCompare(b.name || "", "he")).map(s => `<option value="${esc(s.id)}" ${s.id === sel ? "selected" : ""}>${esc(s.name)}</option>`).join("");
  return (withAuto ? `<option value="">זיהוי אוטומטי / ספק חדש</option>` : "") + opts;
}
function vInbox() {
  if (!draft) draft = newDraft();
  if (draft.stage === "review") return vReview();
  if (draft.stage === "map") return vExcelMap();
  const d = draft; const isQ = d.kind === "quote";
  const sup = S.suppliers[d.supplierId];
  return `${demoNote()}
  <div class="panel">
    <div class="row between"><h2>${isQ ? "קליטת הצעת מחיר" : "קליטת חשבונית ספק"}</h2>
      <div class="seg"><button data-act="kind" data-k="invoice" class="${!isQ ? "on" : ""}">חשבונית</button><button data-act="kind" data-k="quote" class="${isQ ? "on" : ""}">הצעת מחיר</button></div></div>
    <label class="fld">ספק<select id="dSup">${supOptions(d.supplierId)}</select></label>
    
    <div class="drop" id="drop">
      <div class="row" style="justify-content:center">
        <button class="btn primary" data-act="cam">צלם חשבונית</button>
        <button class="btn" data-act="img">תמונה או PDF</button>
        <button class="btn" data-act="xls">קובץ אקסל</button>
      </div>
      <p class="small muted">חשבונית של כמה עמודים: מצלמים כל עמוד ומוסיפים. אפשר גם לגרור קבצים לכאן.</p>
      ${d.files.length ? `<div class="thumbs">${d.files.map((f, i) => `<div class="thumb">${f.url ? `<img src="${f.url}" alt="עמוד ${i + 1}">` : esc(f.label)}<button data-act="rmfile" data-i="${i}" aria-label="הסר">×</button></div>`).join("")}</div>` : ""}
    </div>
    ${d.files.length ? `<div class="row"><button class="btn primary" data-act="read" ${d.busy ? "disabled" : ""}>${d.busy ? `<span class="spin"></span> Claude קורא את המסמך…` : "קרא את המסמך"}</button>${d.busy ? `<button class="btn" data-act="stop">עצור</button>` : ""}${!d.busy && d.files.length && d.files.every(f => f.kind === "pdf") ? `<button class="btn" data-act="readlocal">קרא בלי Claude</button>` : ""}<span class="small muted" id="readMsg">${esc(d.msg || "")}</span></div>` : ""}
    ${d.err ? `<div class="warnbox">${esc(d.err)}</div>` : ""}
    <p class="small muted">אפשר גם <button class="btn ghost small" data-act="manual">להקליד ידנית</button>.</p>
  </div>
  ${recentDocsPanel()}`;
}
function recentDocsPanel() {

/* PDF -> page images + text layer */
async function pdfToImages(file, maxPages) {
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf, isEvalSupported: false }).promise;
  const imgs = []; let text = "";
  for (let i = 1; i <= Math.min(pdf.numPages, maxPages); i++) {
    const page = await pdf.getPage(i);
    const vp = page.getViewport({ scale: 2 });
    const c = document.createElement("canvas"); c.width = vp.width; c.height = vp.height;
    await page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
    imgs.push(await new Promise(r => c.toBlob(r, "image/jpeg", 0.85)));
    try { const tc = await page.getTextContent(); text += tc.items.map(t => t.str).join(" ") + "\n"; } catch (e) { }
  }
  return { imgs, text };
}

let groupSug = null, groupBusy = false;
const sizeOf = p => (p.sizeAmount > 0 ? { amount: n(p.sizeAmount), unit: p.sizeUnit || "kg" } : parseSize(p.name));
const unitLbl = u => u === "l" ? "ליטר" : "ק\"ג";
function vCompare() {
  const P = Object.values(S.products);
  const groups = {}; for (const p of P) if (p.group) (groups[p.group] ||= []).push(p);
  const ungrouped = P.filter(p => !p.group);
  const glist = Object.keys(groups).sort((a, b) => a.localeCompare(b, "he"));
  const card = g => {
    const rows = groups[g].map(p => { const s = stats(p.id); const sz = sizeOf(p); const best = s.best?.eff ?? s.cost; const perStd = best && sz ? best / sz.amount : null; const sellStd = s.sell && sz ? s.sell / sz.amount : null; return { p, s, sz, best, perStd, sellStd }; });
    const std = rows.every(r => r.perStd != null) && new Set(rows.map(r => r.sz.unit)).size === 1;
    const key = r => std ? r.perStd : r.best;
    rows.sort((a, b) => (key(a) ?? 1e12) - (key(b) ?? 1e12));
    const top = rows.find(r => key(r) != null), second = rows.filter(r => key(r) != null)[1];
    const u = std ? unitLbl(rows[0].sz.unit) : "יחידה";
    return `<div class="panel"><div class="row between"><h3>${esc(g)}</h3><span class="small muted">${rows.length === 1 ? "מוצר אחד" : rows.length + " מוצרים"} · השוואה ל${u}</span></div>
      ${top && second ? `<p>הכי משתלם: <b>${esc(top.p.brand || top.p.name)}</b> · ${money(key(top))} ל${u}, זול ב-${pct(1 - key(top) / key(second))} מ${esc(second.p.brand || second.p.name)}.</p>` : ""}
      <div class="tbl"><table><thead><tr><th>מוצר</th><th>חברה</th><th>גודל</th><th>ספק זול</th><th>עלות ליח'</th>${std ? `<th>עלות ל${u}</th>` : ""}<th>מחיר בחנות</th>${std ? `<th>מחיר ל${u}</th>` : ""}<th>רווח</th></tr></thead><tbody>
      ${rows.map(r => `<tr><td><button class="btn ghost" data-act="openprod" data-pid="${esc(r.p.id)}">${esc(r.p.name)}</button></td><td>${esc(r.p.brand || "—")}</td><td class="num">${r.sz ? (r.sz.amount < 1 ? Math.round(r.sz.amount * 1000) + (r.sz.unit === "l" ? " מ\"ל" : " גרם") : r.sz.amount + " " + unitLbl(r.sz.unit)) : "—"}</td><td>${r.s.best ? esc(supName(r.s.best.sup)) : "—"}</td><td class="num">${money(r.best)}</td>${std ? `<td class="num ${r === top ? "best" : ""}">${money(r.perStd)}</td>` : ""}<td class="num">${money(r.s.sell)}</td>${std ? `<td class="num">${money(r.sellStd)}</td>` : ""}<td class="num" style="color:var(${r.s.margin == null ? "--muted" : r.s.margin < r.s.target - 0.005 ? "--bad" : "--good"})">${pct(r.s.margin)}</td></tr>`).join("")}
      </tbody></table></div></div>`;
  };

  <div class="row between"><h2>מוצרים דומים</h2>${ungrouped.length ? `<button class="btn primary" data-act="suggestgroups" ${groupBusy ? "disabled" : ""}>${groupBusy ? `<span class="spin"></span> מסדר לקבוצות…` : `סדר ${ungrouped.length} מוצרים לקבוצות`}</button>` : ""}</div>

  ${groupSug ? `<div class="panel"><h3>הצעה לקבוצות</h3><p class="small muted">בטל סימון של מה שלא מתאים, ואפשר לשנות את שם הקבוצה.</p>
    <div class="stack">${groupSug.map((g, i) => `<label class="row small" style="align-items:flex-start"><input type="checkbox" data-gs="${i}" checked> <span style="flex:1;min-width:0"><b>${esc(S.products[g.id]?.name || g.id)}</b><br><input data-gsn="${i}" value="${esc(g.group)}" style="margin-top:4px;width:100%"> <span class="muted">חברה: <input data-gsb="${i}" value="${esc(g.brand || "")}" style="width:140px"></span></span></label>`).join("")}</div>
    <div class="row"><button class="btn primary" data-act="applygroups">שמור קבוצות</button><button class="btn ghost" data-act="cancelgroups">ביטול</button></div></div>` : ""}
  ${glist.length ? glist.map(card).join("") : emptyMsg("עדיין אין קבוצות", "לחץ על \"סדר לקבוצות\", או קבע קבוצה לכל מוצר בחלון פרטי המוצר.")}

function localGroupGuess(list) {
  // without AI: products that share their first words (after removing sizes) go together
  const key = nm => norm(String(nm).replace(/\d+(?:[.,]\d+)?\s*(ק"ג|קג|גרם|גר'?|ג'|ליטר|ל'|מ"ל|מל|יח'?)/g, "")).split(" ").filter(w => w.length > 1 && !/^\d/.test(w));
  return list.map(p => { const k = key(p.name); return { id: p.id, group: k.slice(0, 2).join(" "), brand: "" }; });
}
async function suggestGroups() {
  const list = Object.values(S.products).filter(p => !p.group).slice(0, 250);
  const existing = [...new Set(Object.values(S.products).map(p => p.group).filter(Boolean))];

    if (!sample) throw { code: "no_sample" };
    const res = await sample.json(`You group a small Israeli store's products for price comparison across brands. Products of the same kind that a shopper would substitute for each other go in one group (e.g. milk chocolate bars of different brands → "שוקולד חלב"; dry adult dog food 15 kg of different brands → "מזון יבש לכלב בוגר"). Ignore package size in the group name (comparison is per kg/liter). Prefer these existing groups when they fit: ${JSON.stringify(existing)}.
Products (id, name): ${JSON.stringify(list.map(p => [p.id, p.name]))}
Reply with ONLY a JSON array: [{"id":string,"group":string (short Hebrew),"brand":string (manufacturer brand in Hebrew as written in the name, or "")}] covering every product.`, { modelTier: "quick", cache: false });
    groupSug = (Array.isArray(res) ? res : []).filter(g => g && S.products[g.id] && g.group);

  }

async function applyGroups() {

  <div class="row between"><button class="btn" data-edit>פתח לעריכה</button><button class="btn ghost danger" data-del>מחק</button></div>
  <div class="warnbox" data-confirm hidden>למחוק את המסמך? העלויות שלו יוסרו מההשוואות. <button class="btn danger" data-delyes>כן, מחק</button></div></div>`;
  document.body.append(bg);
  bg.addEventListener("click", async e => {
    if (e.target === bg || e.target.closest("[data-x]")) bg.remove();
    if (e.target.closest("[data-del]")) bg.querySelector("[data-confirm]").hidden = false;
    if (e.target.closest("[data-delyes]")) { await del((kind === "q" ? "quotes/" : "purchases/") + id); bg.remove(); toast("נמחק"); }
    if (e.target.closest("[data-edit]")) {
      bg.remove();
      draft = { ...newDraft(kind === "q" ? "quote" : "invoice"), stage: "review", source: x.source || "manual", editId: id, supplierId: x.supplierId, newSupName: "", saveTemplate: false, templateNotes: "", doubts: [],
        doc: { docNo: x.docNo || "", date: x.date || today(), validUntil: x.validUntil || "", pricesIncludeVat: !!x.pricesIncludeVat, docDiscount: x.docDiscount || { type: "none", value: 0, onVat: "before" }, printedTotal: x.totalWithVat, lines: (x.lines || []).map(l => ({ ...l, how: "manual" })) }, ai: null };
      go("inbox"); render();
    }
  });
}

/* ---------- SETTINGS ---------- */

  const s = S.settings; const hasDemo = [...Object.values(S.products), ...Object.values(S.suppliers), ...S.purchases, ...S.quotes].some(x => x.demo);
  return `<div class="panel"><h2>הגדרות החנות</h2>
  <div class="grid">
    <label class="fld">מע"מ %<input id="sVat" type="number" step="any" value="${s.vat}"></label>
    <label class="fld">יעד רווח גולמי ברירת מחדל %<input id="sMargin" type="number" step="any" value="${s.margin}"></label>
    <label class="fld">עיגול מחיר מומלץ<select id="sRound"><option value="90" ${s.rounding === "90" ? "selected" : ""}>ל-90 אגורות (9.90)</option><option value="int" ${s.rounding === "int" ? "selected" : ""}>לשקל שלם</option><option value="10ag" ${s.rounding === "10ag" ? "selected" : ""}>ל-10 אגורות</option><option value="none" ${s.rounding === "none" ? "selected" : ""}>בלי עיגול</option></select></label>
    <label class="fld">התראה על עליית מחיר מעל %<input id="sAlert" type="number" step="any" value="${s.alertPct}"></label>
    <label class="fld">להציג ספק זול יותר מעל % חיסכון<input id="sCheap" type="number" step="any" value="${s.cheaperPct}"></label>
  </div>
  <p class="small muted">רווח גולמי מחושב מהמחיר לצרכן לפני מע"מ: (מחיר לפני מע"מ − עלות אמיתית) ÷ מחיר לפני מע"מ.</p>
  <div class="row"><button class="btn primary" data-act="savesettings">שמור הגדרות</button></div></div>
  ${hasDemo ? `<div class="panel"><h3>נתוני דוגמה</h3><p class="muted">המערכת מגיעה עם כמה מוצרים, ספקים וחשבוניות לדוגמה כדי להראות איך היא עובדת. מחק אותם לפני שמתחילים לעבוד.</p><div class="row"><button class="btn danger" data-act="deldemo">מחק נתוני דוגמה</button></div><div class="warnbox" id="demoConfirm" hidden>כל הנתונים המסומנים "דוגמה" יימחקו. <button class="btn danger" data-act="deldemoyes">כן, מחק</button></div></div>` : ""}
  ${window.LOCAL ? LOCAL.panel() : ""}<div class="panel"><h3>חיבור לקופה</h3><p class="muted">כרגע מחירי המכירה נכנסים מייצוא אקסל של הקופה (לשונית מוצרים) או בהקלדה. אם לקופה יש ממשק API אפשר לחבר אותה כך שהמחירים יתעדכנו לבד.</p></div>`;
}

/* ---------- export ---------- */
async function saveXlsx(filename, rows) {
  if (!downloads) { toast("הורדת קבצים לא זמינה בתצוגה הזו"); return false; }
  const ws = XLSX.utils.aoa_to_sheet(rows); ws["!cols"] = rows[0].map(() => ({ wch: 18 }));
  const wb = XLSX.utils.book_new(); wb.Workbook = { Views: [{ RTL: true }] }; XLSX.utils.book_append_sheet(wb, ws, "גיליון1");
  const data = XLSX.write(wb, { type: "array", bookType: "xlsx" });
  try { await downloads.save({ filename, data: new Uint8Array(data) }); return true; } catch (e) { if (e?.code !== "declined") toast("ההורדה נכשלה"); return false; }
}

/* ---------- actions ---------- */
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act;
  switch (a) {
    case "kind": draft.kind = b.dataset.k; render(); break;
    case "cam": openCam(); break;
    case "img": $("#fImg").click(); break;
    case "xls": $("#fXls").click(); break;
    case "pos": $("#fPos").click(); break;
    case "rmfile": draft.files.splice(+b.dataset.i, 1); render(); break;
    case "read": readDoc(); break;
    case "readlocal": readLocal(false); break;
    case "stop": readCtl?.abort(); break;
    case "manual": startReview({ lines: [{ name: "", qty: 1, unitPrice: 0 }], date: today() }, "manual"); break;
    case "cancel": draft = newDraft(draft?.kind); render(); break;
    case "addline": draft.doc.lines.push({ name: "", barcode: "", qty: 1, freeQty: 0, packSize: 1, unitPrice: 0, lineDiscountPct: 0, pid: "", how: "new" }); render(); break;
    case "rmline": draft.doc.lines.splice(+b.dataset.i, 1); if (draft.ai) draft.ai.lines.splice(+b.dataset.i, 1); render(); break;
    case "save": saveDraft(); break;
    case "suggestgroups": suggestGroups(); break;
    case "applygroups": applyGroups(); break;
    case "cancelgroups": groupSug = null; render(); break;
    case "rkind": draft.kind = b.dataset.k; draft.merge = null; draft.mergeAsk = null; render(); break;
    case "mergeyes": draft.merge = true; saveDraft(); break;
    case "mergeno": draft.merge = false; saveDraft(); break;
    case "applyxls": applyExcel(draft.map, false); break;
    case "openprod": prodModal(b.dataset.pid); break;
    case "addprod": prodModal(null); break;
    case "setprice": b.disabled = true; await setPrice(b.dataset.pid, n(b.dataset.v)); break;
    case "newdoc": lastSaved = null; draft = newDraft(); go("inbox"); break;
    case "clearlast": lastSaved = null; render(); break;
    case "newquote": draft = newDraft("quote"); go("inbox"); break;
    case "opendoc": docModal(b.dataset.k, b.dataset.id); break;
    case "posclose": posMap = null; render(); break;
    case "posapply": applyPos(); break;
    case "learn": draft = newDraft("invoice"); draft.supplierId = b.dataset.id; go("inbox"); break;
    case "addsup": { const id = "s-" + uid(); await put("suppliers/" + id, { name: "ספק חדש", taxId: "", rebatePct: 0 }); toast("נוסף ספק. ערוך את הפרטים שלו."); break; }
    case "savesup": {
      const box = b.closest("[data-sup]"); const s = { ...S.suppliers[b.dataset.id] }; delete s.id;
      box.querySelectorAll("[data-sf]").forEach(i => s[i.dataset.sf] = i.type === "number" ? n(i.value) : i.value);
      await put("suppliers/" + b.dataset.id, s); toast("הספק נשמר"); break; }
    case "clearcorr": case "clearmap": case "clearpdf": { const s = { ...S.suppliers[b.dataset.id] }; delete s.id; if (a === "clearcorr") s.corrections = []; else if (a === "clearpdf") delete s.pdfMap; else delete s.excelMap; await put("suppliers/" + b.dataset.id, s); toast("נמחק"); break; }
    case "savesettings": await put("settings/main", { vat: n($("#sVat").value), margin: n($("#sMargin").value), rounding: $("#sRound").value, alertPct: n($("#sAlert").value), cheaperPct: n($("#sCheap").value) }); toast("ההגדרות נשמרו"); break;
    case "deldemo": $("#demoConfirm").hidden = false; break;
    case "deldemoyes": {
      b.disabled = true;
      const jobs = [...Object.values(S.products).filter(x => x.demo).map(x => "products/" + x.id), ...Object.values(S.suppliers).filter(x => x.demo).map(x => "suppliers/" + x.id), ...S.purchases.filter(x => x.demo).map(x => "purchases/" + x.id), ...S.quotes.filter(x => x.demo).map(x => "quotes/" + x.id), ...S.changes.filter(x => x.demo).map(x => "pricechanges/" + x.id)];
      for (const p of jobs) await del(p); toast("נתוני הדוגמה נמחקו"); break; }
    case "exportchanges": {
      const pend = S.changes.filter(c => !c.exported);
      const ok = await saveXlsx(`עדכון-מחירים-${today()}.xlsx`, [["ברקוד", "שם", "מחיר קודם", "מחיר חדש", "תאריך"], ...pend.map(c => [c.barcode, c.name, c.old ?? "", c.new, new Date(c.at).toLocaleDateString("he-IL")])]);
      if (ok) for (const c of pend) { const x = { ...c }; delete x.id; x.exported = true; await put("pricechanges/" + c.id, x); }
      break; }
    case "exportprods": {
      const rows = Object.values(S.products).map(p => { const s = stats(p.id); return [p.barcode || "", p.name, s.cost ? +s.cost.toFixed(2) : "", s.best ? supName(s.best.sup) : "", s.best ? +s.best.eff.toFixed(2) : "", s.sell ?? "", s.margin != null ? +(s.margin * 100).toFixed(1) : "", s.rec ?? ""]; });
      await saveXlsx(`מוצרים-${today()}.xlsx`, [["ברקוד", "שם", "עלות אמיתית", "ספק זול", "עלות אצלו", "מחיר בחנות", "רווח %", "מחיר מומלץ"], ...rows]);
      break; }
  }
});

/* ---------- boot ---------- */
(async function boot() {
  route();
  if (!window.claude?.use) { setStatus("פתח את הדף מתוך Claude כדי לשמור נתונים"); return; }
  [db, sample, downloads] = await Promise.all([claude.use("db"), claude.use("sample"), claude.use("downloads")]);
  if (!db) { setStatus("שמירת נתונים לא זמינה בתצוגה הזו"); return; }
  subscribe();
})();
</script>
