<body>

  <header class="top">
    <div class="top-in">
      <div class="brand">
        <span id="logoSlot"></span>

</div>
<div id="full"><div class="loading">טוען…</div></div>
<div id="overlayRoot"></div>

<script>
const $ = s => document.querySelector(s);
const sb = makeClient();
let S = null;            // {store, products, customers}
let videoURL = null;
let trimBlob = null, trimURL = null, trimBusy = false;
const MAX_VIDEO_MB = 60;

/* ---------- small ui ---------- */
function toast(t){
  const el = document.createElement('div'); el.className='toast'; el.setAttribute('role','status'); el.textContent=t;
  document.body.appendChild(el); setTimeout(()=>el.remove(), 3400);
}
function fail(e, fallback){ console.error(e); toast(fallback || 'משהו השתבש. בדקו את החיבור לאינטרנט ונסו שוב.'); }
function showFull(html){ $('#shell').hidden = true; $('#full').hidden = false; $('#full').innerHTML = html; }

/* ---------- domain on top of loaded state ---------- */
const prod = id => S.products.find(p => p.id===id) || S.products[0];
const lastBuy = c => c.purchases.length ? c.purchases[c.purchases.length-1].date : c.consent.date;
const lastRem = c => c.reminders.length ? c.reminders[c.reminders.length-1].date : null;
function cycle(c){
  const p = prod(c.productId), base = baseDays(c, p);
  const dates = c.purchases.map(x => x.date).sort(), gaps = [];
  for (let i=1;i<dates.length;i++){ const g = diff(dates[i], dates[i-1]); if (g>=3) gaps.push(g); }
  const recent = gaps.slice(-3);
  if (recent.length) return {days:Math.round(recent.reduce((a,b)=>a+b,0)/recent.length), base, learned:recent.length};
  return {days:base, base, learned:0};
}
function status(c){
  const L = lastBuy(c), cy = cycle(c), due = addDays(L, cy.days), left = diff(due, today());
  const R = lastRem(c), remAfter = R && R > L;
  let st;
  if (remAfter) st = (diff(today(), R) >= 6 && left < 0) ? 'followup' : 'sent';
  else if (left < 0) st = 'overdue'; else if (left <= 5) st = 'due'; else if (left <= 10) st = 'soon'; else st = 'ok';
  return {st, left, due, cy, frac:Math.max(0, Math.min(1, left / cy.days)), R};
}
const ST_LABEL = {overdue:'כנראה כבר נגמר', due:'נגמר בקרוב', followup:'לא חזר – לפנות שוב', sent:'נשלחה תזכורת', soon:'עוד כשבוע וחצי', ok:'מכוסה'};
const needsAction = s => s.st==='overdue' || s.st==='due' || s.st==='followup';
const petPhrase = c => c.petName ? c.petName : PETS[c.pet].the;
function daysPhrase(left){
  if (left <= 0) return 'רק לעוד ממש מעט, אם בכלל';
  if (left === 1) return 'בערך ליום אחד';
  if (left <= 2) return 'לעוד יום-יומיים';
  return 'לעוד כ-'+left+' ימים';
}
function buildMsg(c){
  const s = status(c), p = prod(c.productId);
  return S.store.template
    .replaceAll('{שם}', c.name.split(' ')[0]).replaceAll('{חנות}', S.store.name)
    .replaceAll('ל{חיה}', 'ל'+(c.petName || PETS[c.pet].the.slice(1))).replaceAll('{חיה}', petPhrase(c))
    .replaceAll('{מה}', p.kind==='litter' ? 'חול' : 'אוכל').replaceAll('{ימים}', daysPhrase(s.left))
    .replaceAll('{מוצר}', p.name+' '+p.kg+' ק"ג');
}
const waLink = c => 'https://wa.me/'+intl(c.phone)+'?text='+encodeURIComponent(buildMsg(c));
function returns(fromDays=30){
  const out = [], since = addDays(today(), -fromDays);
  for (const c of S.customers){
    const buys = [...c.purchases].sort((a,b)=>a.date<b.date?-1:1);
    buys.forEach((b,i) => {
      if (b.date < since) return;
      const prev = i>0 ? buys[i-1].date : '0000';
      const r = c.reminders.find(r => r.date > prev && r.date <= b.date && diff(b.date, r.date) <= 10);
      if (r) out.push({c, b, r});
    });
  }
  return out;
}
const joinUrl = () => new URL('join.html?s='+encodeURIComponent(S.store.slug), location.href).href;

/* ---------- data ---------- */
const mapCustomer = (r, P, R) => ({
  id:r.id, name:r.name, phone:r.phone, pet:r.pet, petName:r.pet_name||'', size:Number(r.size), count:r.count, productId:r.product_id,
  consent:{date:String(r.consent_at).slice(0,10), source:r.consent_source},
  purchases:(P[r.id]||[]).map(p=>({id:p.id, date:p.date, productId:p.product_id, price:Number(p.price)})).sort((a,b)=>a.date<b.date?-1:1),
  reminders:(R[r.id]||[]).map(x=>({id:x.id, date:x.date})).sort((a,b)=>a.date<b.date?-1:1)
});
async function loadAll(store){
  const sid = store.id, since = addDays(today(), -400);
  const [pr, cu, pu, re] = await Promise.all([
    sb.from('products').select('*').eq('store_id', sid).order('created_at'),
    sb.from('customers').select('*').eq('store_id', sid).eq('opted_out', false),
    sb.from('purchases').select('id,customer_id,product_id,price,date').eq('store_id', sid).gte('date', since).limit(20000),
    sb.from('reminders').select('id,customer_id,date').eq('store_id', sid).gte('date', since).limit(20000)
  ]);
  for (const r of [pr,cu,pu,re]) if (r.error) throw r.error;
  const group = rows => rows.reduce((m,x)=>((m[x.customer_id] ||= []).push(x), m), {});
  const P = group(pu.data), R = group(re.data);
  S = {store, products: pr.data.map(p=>({...p, kg:Number(p.kg), price:Number(p.price)})), customers: cu.data.map(r=>mapCustomer(r,P,R))};
  videoURL = videoPublicUrl(sb, store.video_path);
}

/* ---------- auth ---------- */
function renderAuth(mode='login', msg=''){
  showFull(`<div class="auth"><div class="auth-card">
    <div class="row">${LOGO_SVG}<div><h1>נאמן</h1><span class="eyebrow">מערכת שימור לקוחות לחנויות חיות</span></div></div>
    ${mode==='newpass' ? '' : `<div class="seg" role="group" aria-label="כניסה או הרשמה">
      <button type="button" data-auth="login" aria-pressed="${mode==='login'}">כניסה</button>
      <button type="button" data-auth="signup" aria-pressed="${mode==='signup'}">חנות חדשה</button></div>`}
    <form class="form" id="authForm" novalidate>
      ${mode==='newpass' ? '' : '<div class="field"><label for="aEmail">אימייל</label><input id="aEmail" type="email" autocomplete="email" dir="ltr" required></div>'}
      ${mode==='forgot' ? '' : `<div class="field"><label for="aPass">${mode==='newpass'?'סיסמה חדשה':'סיסמה'}</label><input id="aPass" type="password" autocomplete="${mode==='login'?'current-password':'new-password'}" dir="ltr" minlength="8" required>${mode!=='login'?'<span class="hint">לפחות 8 תווים</span>':''}</div>`}
      <div class="err" id="aErr" role="alert"></div>
      <div class="ok-msg" role="status">${esc(msg)}</div>
      <button class="btn primary big" type="submit">${{login:'כניסה', signup:'פתיחת חשבון לחנות', forgot:'שליחת קישור לאיפוס', newpass:'שמירת סיסמה'}[mode]}</button>
      ${mode==='login' ? '<button class="link" type="button" data-auth="forgot">שכחתי סיסמה</button>' : ''}
      ${mode==='forgot' ? '<button class="link" type="button" data-auth="login">חזרה לכניסה</button>' : ''}
    </form></div></div>`);
  document.querySelectorAll('[data-auth]').forEach(b => b.onclick = () => renderAuth(b.dataset.auth));
  $('#authForm').onsubmit = async e => {
    e.preventDefault();
    const err = $('#aErr'); err.textContent = '';
    const email = $('#aEmail')?.value.trim(), pass = $('#aPass')?.value;
    if (mode!=='newpass' && !/^\S+@\S+\.\S+$/.test(email||'')){ err.textContent = 'כתובת האימייל לא תקינה.'; return; }
    if (mode!=='forgot' && (pass||'').length < 8){ err.textContent = 'הסיסמה צריכה להיות לפחות 8 תווים.'; return; }
    const btn = e.submitter; if (btn) btn.disabled = true;
    try {
      if (mode==='login'){
        const {error} = await sb.auth.signInWithPassword({email, password:pass});
        if (error) throw error;
      } else if (mode==='signup'){
        const {data, error} = await sb.auth.signUp({email, password:pass, options:{emailRedirectTo: location.href.split('#')[0]}});
        if (error) throw error;
        if (!data.session) return renderAuth('login', 'שלחנו מייל לאישור. אחרי שתלחצו על הקישור במייל, חזרו לכאן והתחברו.');
      } else if (mode==='forgot'){
        const {error} = await sb.auth.resetPasswordForEmail(email, {redirectTo: location.href.split('#')[0]});
        if (error) throw error;
        return renderAuth('login', 'אם הכתובת רשומה, נשלח אליה קישור לאיפוס הסיסמה.');
      } else if (mode==='newpass'){
        const {error} = await sb.auth.updateUser({password:pass});
        if (error) throw error;
        recovering = false; toast('הסיסמה עודכנה'); return start();
      }
    } catch(ex){
      const m = String(ex.message||'');
      err.textContent = /Invalid login/i.test(m) ? 'האימייל או הסיסמה לא נכונים.' : /already registered/i.test(m) ? 'האימייל הזה כבר רשום. נסו להתחבר.' : /Email not confirmed/i.test(m) ? 'צריך קודם לאשר את המייל שקיבלתם.' : 'לא הצלחנו: '+m;
    } finally { if (btn) btn.disabled = false; }
  };
}

/* ---------- onboarding: create the store ---------- */
function renderOnboarding(){
  showFull(`<div class="auth"><div class="auth-card">
    <div class="row">${LOGO_SVG}<div><span class="eyebrow">שלב אחרון</span><h1>פרטי החנות</h1></div></div>
    <form class="form" id="obForm" novalidate>
      <div class="field"><label for="oName">שם החנות, כמו שהלקוחות מכירים אותה</label><input id="oName" required maxlength="80" placeholder="חיות ושות׳ – רמת גן"></div>
      <div class="field"><label for="oSlug">שם קצר באנגלית לקישור</label><input id="oSlug" dir="ltr" required placeholder="hayot-ramat-gan" maxlength="40">
        <span class="hint">אותיות באנגלית קטנות, מספרים ומקפים. הלקוחות יראו אותו בקישור ההרשמה.</span></div>
      <div class="field"><label for="oWa">מספר הוואטסאפ של החנות</label><input id="oWa" class="num" inputmode="tel" placeholder="05X-XXXXXXX"></div>
      <div class="err" id="oErr" role="alert"></div>
      <button class="btn primary big" type="submit">פתיחת החנות</button>
      <button class="link" type="button" id="oOut">יציאה מהחשבון</button>
    </form></div></div>`);
  $('#oOut').onclick = () => sb.auth.signOut();
  $('#oSlug').oninput = e => { e.target.value = e.target.value.toLowerCase().replace(/[^a-z0-9-]/g,''); };
  $('#obForm').onsubmit = async e => {
    e.preventDefault();
    const err = $('#oErr'); err.textContent='';
    const name = $('#oName').value.trim(), slug = $('#oSlug').value.trim(), wa = $('#oWa').value.trim();
    if (name.length < 2){ err.textContent = 'חסר שם חנות.'; return; }
    if (!/^[a-z0-9][a-z0-9-]{2,39}$/.test(slug)){ err.textContent = 'השם באנגלית צריך להיות 3 עד 40 תווים: אותיות קטנות, מספרים ומקפים.'; return; }
    if (wa && !validPhone(wa)){ err.textContent = 'מספר הוואטסאפ צריך להיות נייד ישראלי, 10 ספרות.'; return; }
    const {error} = await sb.from('stores').insert({name, slug, whatsapp: wa ? normPhone(wa) : null});
    if (error){ err.textContent = error.code==='23505' ? 'השם באנגלית הזה כבר תפוס. נסו שם אחר.' : 'לא הצלחנו לפתוח את החנות: '+error.message; return; }
    start();
  };
}

/* ---------- views ---------- */
function bagHTML(s){
  const C = 2*Math.PI*24, off = C*(1-s.frac);
  const col = (s.st==='overdue'||s.st==='followup') ? 'var(--danger)' : s.st==='due' ? 'var(--brass)' : s.st==='sent' ? 'var(--muted)' : 'var(--em-ring)';
  return `<div class="ring" aria-hidden="true"><svg viewBox="0 0 58 58"><circle cx="29" cy="29" r="24" class="trk"/><circle cx="29" cy="29" r="24" class="val" style="stroke:${col};stroke-dasharray:${C.toFixed(1)};stroke-dashoffset:${off.toFixed(1)}"/></svg><b class="num">${Math.max(0,s.left)}</b><small>ימים</small></div>`;
}
function custRow(c, mode){
  const s = status(c), p = prod(c.productId);
  const leftTxt = s.left<0 ? 'נגמר לפני כ-'+(-s.left)+' ימים' : s.left===0 ? 'נגמר היום' : 'נשארו כ-'+s.left+' ימים';
  const acts = mode==='today'
    ? `<a class="btn wa" href="${esc(waLink(c))}" target="_blank" rel="noopener">פתח בוואטסאפ</a><button class="btn" data-act="sent" data-id="${c.id}">✓ שלחתי</button>`
    : `<button class="btn" data-act="buy" data-id="${c.id}">נמכר שוב</button>`;
  return `<div class="cust">${bagHTML(s)}
    <div class="who">
      <div class="row" style="gap:8px"><strong>${esc(c.name)}</strong><span class="pill st-${s.st}">${ST_LABEL[s.st]}</span></div>
      <div class="meta">${esc(petPhrase(c))} · ${esc(p.name)} ${p.kg} ק"ג · <span class="num">${leftTxt}</span>${s.st==='sent'||s.st==='followup' ? ' · תזכורת '+ago(s.R) : ''}</div>
      <div><button class="link" data-act="open" data-id="${c.id}">פרטים וחישוב ←</button></div>
    </div><div class="acts">${acts}</div></div>`;
}
function optionsFor(pet, sel){
  return S.products.filter(p => p.active && kindsFor(pet).includes(p.kind))
    .map(p => `<option value="${p.id}" ${p.id===sel?'selected':''}>${esc(p.name)} ${p.kg} ק"ג</option>`).join('');
}
function eodHTML(todays){
  let total=0; for (let i=1;i<=14;i++){ const d=addDays(today(),-i); total += S.customers.reduce((a,c)=>a+c.purchases.filter(p=>p.date===d).length,0); }
  const avg = total/14, low = avg >= 1 && todays < avg*0.6;
  return `<p class="sub">היום נרשמו <b class="num">${todays}</b> מכירות של מזון וחול. בממוצע נרשמות <b class="num">${avg.toFixed(1)}</b> ביום.</p>
  ${low ? `<p style="margin:.5em 0 0;color:var(--warn);font-weight:600">נרשמו פחות מכירות מהרגיל. אולי מכירות מהיום לא נרשמו?</p>` : `<p style="margin:.5em 0 0;color:var(--ok);font-weight:600">נראה תקין.</p>`}`;
}

const views = {};
views.today = () => {
  const all = S.customers.map(c => ({c, s:status(c)}));
  const act = all.filter(x => needsAction(x.s)).sort((a,b)=>a.s.left-b.s.left);
  const waiting = all.filter(x => x.s.st==='sent');
  const ret = returns(30), rev = ret.reduce((a,x)=>a+x.b.price,0);
  const todays = S.customers.reduce((a,c)=>a+c.purchases.filter(p=>p.date===today()).length,0);
  const h = new Date().getHours();
  if (!S.customers.length) return `<div class="hello"><span class="eyebrow">${fmtLong(today())}</span><h2>ברוכים הבאים, ${esc(S.store.name)}</h2>
    <p class="sub">עוד אין לקוחות. שלושה צעדים כדי להתחיל:</p></div>
    <section class="panel"><ol style="margin:0;padding-inline-start:20px;display:grid;gap:10px">
      <li><a href="#setup">בהגדרות</a>: בדקו את רשימת המוצרים והמחירים, והעלו סרטון של החנות.</li>
      <li>שימו טאבלט ליד הקופה <a href="#kiosk">על עמדת ה-QR</a>, או הדפיסו את קישור ההרשמה.</li>
      <li>אחרי כל מכירה של מזון: <a href="#sale">רישום מכירה</a>. מחר בבוקר כבר תופיע כאן רשימה.</li></ol></section>`;
  return `<div class="hello"><span class="eyebrow">${fmtLong(today())}</span>
    <h2>${h<12?'בוקר טוב':h<18?'צהריים טובים':'ערב טוב'}. ${act.length ? act.length+' לקוחות מחכים לך היום.' : 'כל הלקוחות מכוסים.'}</h2>
    <p class="sub">אלה הלקוחות שהאוכל שלהם נגמר בימים הקרובים. הודעה אחת עכשיו, והם קונים אצלך ולא באינטרנט.</p></div>
  <div class="kpis">
    <div class="kpi hero"><span>לפנות היום</span><b class="num">${act.length}</b></div>
    <div class="kpi"><span>מחכים לתשובה</span><b class="num">${waiting.length}</b></div>
    <div class="kpi"><span>חזרו אחרי תזכורת · 30 יום</span><b class="num">${ret.length}</b></div>
    <div class="kpi gold"><span>הכנסה שהמערכת החזירה</span><b class="num">${money(rev)}</b></div></div>
  <section class="panel">
    <div class="row"><h2>למי לפנות היום</h2><span class="spacer"></span><a class="btn" href="#sale">+ רישום מכירה</a></div>
    <p class="sub">"פתח בוואטסאפ" פותח הודעה מוכנה לשליחה מהוואטסאפ של החנות. אחרי ששלחת, לחץ "שלחתי".</p>
    <div class="list">${act.length ? act.map(x=>custRow(x.c,'today')).join('') : '<div class="empty">אין למי לפנות היום. כל השקים מלאים.</div>'}</div>
    ${waiting.length ? `<details class="more"><summary>מחכים לתשובה (${waiting.length})</summary><div class="list">${waiting.map(x=>custRow(x.c,'list')).join('')}</div></details>`:''}
  </section>
  <section class="panel"><h2>בדיקת סוף יום</h2>${eodHTML(todays)}</section>`;
};
views.customers = () => {
  const rows = S.customers.map(c=>({c,s:status(c)})).sort((a,b)=>a.s.left-b.s.left);
  return `<section class="panel">
    <div class="row"><h2>כל הלקוחות</h2><span class="sub">(${S.customers.length})</span><span class="spacer"></span><a class="btn primary" href="#sale">+ לקוח חדש / מכירה</a></div>
    <div class="field" style="margin-top:12px"><label for="custFilter">חיפוש</label><input id="custFilter" placeholder="שם, טלפון או שם החיה"></div>
    <div class="list" id="custList">${rows.map(x=>custRow(x.c,'list')).join('') || '<div class="empty">עוד אין לקוחות</div>'}</div></section>`;
};
views.sale = () => `<section class="panel"><h2>רישום מכירה</h2>
    <p class="sub">אחרי כל מכירה של מזון או חול: מקלידים טלפון, בוחרים, וזהו. 5 שניות.</p>
    <div class="field" style="margin-top:14px"><label for="saleSearch">טלפון הלקוח או שם</label>
      <input id="saleSearch" class="search num" inputmode="tel" autocomplete="off" placeholder="05X-XXXXXXX"></div>
    <div id="saleResults" class="list"></div></section>`;
function saleResults(q){
  const nq = normPhone(q), t = q.trim(), box = $('#saleResults'); if (!box) return;
  if (!t){ box.innerHTML = '<div class="empty">התחל להקליד מספר טלפון</div>'; return; }
  const hits = S.customers.filter(c => (nq.length>=3 && c.phone.includes(nq)) || (!/\d/.test(t) && (c.name.includes(t) || (c.petName||'').includes(t))));
  let html = hits.slice(0,5).map(c => {
    const p = prod(c.productId), s = status(c);
    return `<div class="panel" style="padding:16px">
      <div class="row"><strong style="font-size:1.15rem">${esc(c.name)}</strong><span class="sub num">${prettyPhone(c.phone)}</span><span class="pill st-${s.st}">${ST_LABEL[s.st]}</span></div>
      <p class="sub">${esc(petPhrase(c))} · קנה לאחרונה ${ago(lastBuy(c))}</p>
      <div class="row" style="margin-top:10px">
        <button class="btn primary big" data-act="buy" data-id="${c.id}">נמכר: ${esc(p.name)} ${p.kg} ק"ג (${money(p.price)})</button>
        <select class="btn" data-id="${c.id}" data-act="altprod" aria-label="מוצר אחר">${optionsFor(c.pet, c.productId)}</select></div></div>`;
  }).join('');
  if (!hits.length) html = '<div class="empty">לקוח לא נמצא.</div>';
  html += `<button class="btn big" data-act="newcust" data-phone="${esc(validPhone(q)?normPhone(q):'')}">+ לקוח חדש${validPhone(q)?' עם המספר '+prettyPhone(q):''}</button>`;
  box.innerHTML = html;
}

/* ---------- kiosk ---------- */
function attachVideo(v, src){
  if (!v || !src) return;
  v.muted = true; v.loop = true; v.playsInline = true; v.autoplay = true; v.src = src; v.play().catch(()=>{});
}
function renderKiosk(){
  showFull(`<div class="kiosk ${videoURL?'has-video':''}">${videoURL?'<video class="k-video" aria-hidden="true"></video><div class="k-shade"></div>':''}<div class="kiosk-in">
    ${LOGO_SVG.replace('class="logo"','class="logo" style="color:#f4f0e6"')}
    <div class="k-store">${esc(S.store.name)}</div>
    <h1>שהאוכל לא ייגמר לכם באמצע השבוע</h1>
    <p>סרקו, ונשלח לכם תזכורת בוואטסאפ כמה ימים לפני שהשק נגמר</p>
    <div class="qrbox" id="qr" role="img" aria-label="קוד QR להרשמה לתזכורות"></div>
    <div class="k-acts"><a class="btn" href="#sale">רישום ע״י המוכר</a><button class="btn" id="fsBtn" type="button">מסך מלא</button><a class="btn" href="#today">יציאה מהעמדה</a></div>
  </div></div>`);
  attachVideo($('.k-video'), videoURL);
  try { new QRCode($('#qr'), {text:joinUrl(), width:300, height:300, colorDark:'#0c3a33', colorLight:'#ffffff', correctLevel:QRCode.CorrectLevel.M}); } catch(e){ $('#qr').textContent = joinUrl(); }
  $('#fsBtn').onclick = () => document.documentElement.requestFullscreen?.().catch(()=>{});
  try { navigator.wakeLock?.request('screen').catch(()=>{}); } catch(e){}

function wireCustomerForm(){
  const f = $('#custForm');
  f.addEventListener('change', e => { if (e.target.name==='pet'){ const k = e.target.value; $('#sizeLbl').textContent = PETS[k].size; $('#fSize').value = PETS[k].def; $('#fProd').innerHTML = optionsFor(k); } });
  f.addEventListener('submit', async e => {
    e.preventDefault();
    const err = $('#formErr'); err.textContent='';
    const name = $('#fName').value.trim(), phone = normPhone($('#fPhone').value), pet = f.querySelector('input[name=pet]:checked').value, pid = $('#fProd').value;
    if (!name){ err.textContent='חסר שם.'; $('#fName').focus(); return; }
    if (!validPhone(phone)){ err.textContent='מספר הטלפון צריך להיות נייד ישראלי, 10 ספרות שמתחילות ב-05.'; $('#fPhone').focus(); return; }
    if (!pid){ err.textContent='אין מוצר מהסוג הזה. הוסיפו אותו בהגדרות החנות.'; return; }
    if (!$('#fConsent').checked){ err.textContent='בלי אישור של הלקוח אסור לשלוח לו תזכורות. סמן אחרי שהוא אישר.'; return; }
    const btn = e.submitter; if (btn) btn.disabled = true;
    try {
      const {data, error} = await sb.from('customers').insert({store_id:S.store.id, name, phone, pet, pet_name:$('#fPetName').value.trim()||null,
        size:Number($('#fSize').value)||PETS[pet].def, product_id:pid, consent_source:'seller'}).select().single();
      if (error){ err.textContent = error.code==='23505' ? 'המספר הזה כבר רשום (אולי הלקוח ביקש להסיר את עצמו).' : 'השמירה נכשלה: '+error.message; return; }
      const c = mapCustomer(data, {}, {});
      S.customers.push(c);
      if ($('#fNow').checked) await addPurchase(c, pid);
      const s = status(c); toast('נשמר. תזכורת בערך ב'+fmtLong(addDays(s.due,-4)));
      location.hash = '#sale'; route();
    } catch(ex){ fail(ex); } finally { if (btn) btn.disabled = false; }
  });
}

/* ---------- mutations ---------- */
async function addPurchase(c, pid){
  const p = prod(pid || c.productId);
  const {data, error} = await sb.from('purchases').insert({store_id:S.store.id, customer_id:c.id, product_id:p.id, price:p.price}).select('id,date').single();
  if (error) throw error;
  c.purchases.push({id:data.id, date:data.date, productId:p.id, price:p.price});
}
async function recordBuy(id, pid){
  const c = S.customers.find(x=>x.id===id); if (!c) return;
  try {
    if (pid && pid !== c.productId){ const {error} = await sb.from('customers').update({product_id:pid}).eq('id', c.id); if (error) throw error; c.productId = pid; }
    await addPurchase(c, c.productId);
    toast('נרשם. תזכורת הבאה בערך ב'+fmtLong(addDays(status(c).due,-4)));
  } catch(e){ fail(e, 'המכירה לא נשמרה. בדקו את החיבור ונסו שוב.'); }
}
async function markSent(id){
  const c = S.customers.find(x=>x.id===id); if (!c) return;
  if (lastRem(c) === today()){ toast('כבר סומן היום'); return; }
  const {data, error} = await sb.from('reminders').insert({store_id:S.store.id, customer_id:c.id}).select('id,date').single();
  if (error) return fail(error);
  c.reminders.push({id:data.id, date:data.date}); toast('סומן שנשלחה תזכורת ל'+c.name.split(' ')[0]);
}
async function optOut(id){
  const {error} = await sb.from('customers').update({opted_out:true}).eq('id', id);
  if (error) return fail(error);
  S.customers = S.customers.filter(x=>x.id!==id); toast('הלקוח הוסר מהתזכורות');
}
function readProductRows(){
  return [...document.querySelectorAll('tr[data-pid]')].map(tr => {
    const o = {id:tr.dataset.pid}; tr.querySelectorAll('[data-f]').forEach(i => o[i.dataset.f] = i.value); return o;
  });
}
async function saveProducts(){
  const rows = readProductRows();
  for (const r of rows){
    const kg = Number(r.kg), price = Number(r.price);
    if (!r.name.trim() || !(kg>0) || !(price>=0)){ toast('בדקו את השורה "'+(r.name||'ללא שם')+'": חסר שם, משקל או מחיר.'); return false; }
  }
  const res = await Promise.all(rows.map(r => sb.from('products').update({name:r.name.trim(), kind:r.kind, kg:Number(r.kg), price:Number(r.price)}).eq('id', r.id)));
  const bad = res.find(r=>r.error); if (bad){ fail(bad.error); return false; }
  rows.forEach(r => Object.assign(prod(r.id), {name:r.name.trim(), kind:r.kind, kg:Number(r.kg), price:Number(r.price)}));
  return true;
}

/* ---------- video ---------- */
async function uploadVideo(blob, keepOriginal){
  const ext = /webm/.test(blob.type) ? 'webm' : /quicktime/.test(blob.type) ? 'mov' : 'mp4';
  const path = S.store.id+'/'+Date.now()+'.'+ext;
  const up = await sb.storage.from('store-videos').upload(path, blob, {contentType: blob.type || 'video/mp4', upsert:false});
  if (up.error) throw up.error;
  const old = S.store.video_path, oldOrig = S.store.video_orig_path;
  const patch = keepOriginal ? {video_path:path, video_orig_path: oldOrig || old} : {video_path:path, video_orig_path:null};
  const {error} = await sb.from('stores').update(patch).eq('id', S.store.id);
  if (error) throw error;
  const remove = keepOriginal ? (oldOrig ? [old] : []) : [old, oldOrig].filter(Boolean);
  if (remove.length) sb.storage.from('store-videos').remove(remove).catch(()=>{});
  Object.assign(S.store, patch); videoURL = videoPublicUrl(sb, path);
}
async function saveVideoFile(file){
  const err = $('#vidErr'); if (err) err.textContent = '';
  if (!file) return;
  if (!file.type.startsWith('video/')){ err.textContent = 'הקובץ הזה לא סרטון. בחרו קובץ MP4 או MOV.'; return; }
  if (file.size > MAX_VIDEO_MB*1e6){ err.textContent = 'הסרטון גדול מדי ('+Math.round(file.size/1e6)+'MB). עד '+MAX_VIDEO_MB+'MB.'; return; }
  try { toast('מעלה את הסרטון…'); await uploadVideo(file, false); route(); toast('הסרטון נשמר. אפשר להפעיל עליו עריכה חכמה'); }
  catch(e){ console.error(e); err.textContent = 'ההעלאה נכשלה: '+(e.message||''); }
}
const fmtSec = s => s >= 60 ? Math.floor(s/60)+':'+String(Math.round(s%60)).padStart(2,'0') : Math.round(s)+' שניות';
function trimProgress(label, p, extra=''){
  const box = $('#trimBox'); if (!box) return;
  box.hidden = false;
  box.innerHTML = `<div class="trim-step"><b>${label}</b><span class="num">${Math.round(p*100)}%</span></div>
    <div class="trim-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(p*100)}"><i style="width:${(p*100).toFixed(1)}%"></i></div>${extra}`;
}
async function runSmartTrim(){
  if (trimBusy || !videoURL) return;
  if (!SmartTrim.supported()){ $('#vidErr').textContent = 'הדפדפן הזה לא יודע ליצור סרטון. נסו בכרום במחשב.'; return; }
  trimBusy = true; $('#vidErr').textContent = '';
  let local = null;
  try {
    trimProgress('מוריד את הסרטון לעריכה', 0);
    local = URL.createObjectURL(await (await fetch(videoURL)).blob());
    const A = 'מנתח את הסרטון: חדות, תאורה ורעידות';
    const a = await SmartTrim.analyze(local, {target:18, onProgress:p => trimProgress(A, p)});
    if (a.duration <= 22){ $('#trimBox').innerHTML = `<p class="sub">הסרטון כבר קצר (${fmtSec(a.duration)}), אין מה לחתוך.</p>`; return; }
    const tl = `<div class="trim-tl" dir="ltr" aria-hidden="true">${a.segments.map(s => `<i style="left:${(s.a/a.duration*100).toFixed(2)}%;width:${((s.b-s.a)/a.duration*100).toFixed(2)}%"></i>`).join('')}</div>
      <p class="sub">נבחרו ${a.segments.length} קטעים, ${fmtSec(a.kept)} מתוך ${fmtSec(a.duration)}. הקטעים החשוכים, המטושטשים והרועדים ירדו.</p>`;
    trimBlob = await SmartTrim.render(local, a.segments, {onProgress:p => trimProgress('יוצר את הסרטון הערוך', p, tl)});
    if (trimURL) URL.revokeObjectURL(trimURL); trimURL = URL.createObjectURL(trimBlob);
    $('#trimBox').innerHTML = `<div class="trim-step"><b>הגרסה הערוכה מוכנה</b></div>${tl}
      <video class="vid-prev" id="trimPrev" aria-label="הגרסה הערוכה" controls muted loop playsinline></video>
      <div class="row"><button class="btn primary" data-act="savetrim">להשתמש בגרסה הערוכה</button><button class="btn" data-act="canceltrim">להשאיר את המקור</button></div>`;
    attachVideo($('#trimPrev'), trimURL);
  } catch(e){
    console.error(e); $('#trimBox').hidden = true; $('#vidErr').textContent = 'העריכה נכשלה: '+(e.message||'שגיאה לא ידועה')+'. אפשר להמשיך עם הסרטון המקורי.';
  } finally { trimBusy = false; if (local) setTimeout(()=>URL.revokeObjectURL(local), 1000); }
}
async function saveTrim(){
  if (!trimBlob) return;
  try { toast('שומר את הגרסה הערוכה…'); await uploadVideo(trimBlob, true); trimBlob = null; route(); toast('נשמר. המקור שמור למקרה שתרצו לחזור'); }
  catch(e){ console.error(e); $('#vidErr').textContent = 'השמירה נכשלה: '+(e.message||''); }
}
async function revertOrig(){
  const orig = S.store.video_orig_path, cur = S.store.video_path; if (!orig) return;
  const {error} = await sb.from('stores').update({video_path:orig, video_orig_path:null}).eq('id', S.store.id);
  if (error) return fail(error);
  sb.storage.from('store-videos').remove([cur]).catch(()=>{});
  S.store.video_path = orig; S.store.video_orig_path = null; videoURL = videoPublicUrl(sb, orig); route(); toast('חזרנו לסרטון המקורי');
}
async function deleteVideo(){
  const paths = [S.store.video_path, S.store.video_orig_path].filter(Boolean);
  const {error} = await sb.from('stores').update({video_path:null, video_orig_path:null}).eq('id', S.store.id);
  if (error) return fail(error);
  if (paths.length) sb.storage.from('store-videos').remove(paths).catch(()=>{});
  S.store.video_path = S.store.video_orig_path = null; videoURL = null; route(); toast('הסרטון הוסר');
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act]'); if (!t || !S) return;
  const a = t.dataset.act, id = t.dataset.id;
  if (a==='close'){ if (e.target===t) closeDrawer(); return; }
  if (a==='open'){ openCustomer(id); return; }
  if (a==='sent'){ t.disabled = true; await markSent(id); closeDrawer(); route(); return; }
  if (a==='buy'){
    t.disabled = true;
    const sel = document.querySelector(`select[data-act="altprod"][data-id="${id}"]`);
    await recordBuy(id, sel ? sel.value : null); closeDrawer();
    if (location.hash==='#sale'){ $('#saleSearch').value=''; saleResults(''); $('#saleSearch').focus(); } else route();
    return;
  }
  if (a==='copy'){ const c = S.customers.find(x=>x.id===id); navigator.clipboard?.writeText(buildMsg(c)).then(()=>toast('ההודעה הועתקה'), ()=>toast('לא הצלחתי להעתיק')); return; }
  if (a==='copylink'){ navigator.clipboard?.writeText(joinUrl()).then(()=>toast('הקישור הועתק'), ()=>toast('לא הצלחתי להעתיק')); return; }
  if (a==='askdel'){ $('#delRow').innerHTML = `<span>להסיר את ${esc(S.customers.find(x=>x.id===id).name)} מהתזכורות?</span><button class="btn danger" data-act="del" data-id="${id}">כן, להסיר</button><button class="btn" data-act="nodel" data-id="${id}">ביטול</button>`; return; }
  if (a==='nodel'){ openCustomer(id); return; }
  if (a==='del'){ await optOut(id); closeDrawer(); route(); return; }
  if (a==='newcust'){
    $('#view').innerHTML = `<section class="panel"><div class="row"><h2>לקוח חדש</h2><span class="spacer"></span><a class="btn" href="#sale">ביטול</a></div><div style="margin-top:12px">${customerFormHTML(t.dataset.phone)}</div></section>`;
    wireCustomerForm(); $('#fName').focus(); return;
  }
  if (a==='addprod'){
    if (!(await saveProducts())) return;
    const {data, error} = await sb.from('products').insert({store_id:S.store.id, name:'מוצר חדש', kind:'dog', kg:10, price:100}).select().single();
    if (error) return fail(error);
    S.products.push({...data, kg:Number(data.kg), price:Number(data.price)}); route(); return;
  }
  if (a==='delprod'){
    const used = S.customers.some(c=>c.productId===id);
    const r = used ? await sb.from('products').update({active:false}).eq('id', id) : await sb.from('products').delete().eq('id', id);
    if (r.error) return fail(r.error);
    if (used) prod(id).active = false; else S.products = S.products.filter(p=>p.id!==id);
    toast(used ? 'המוצר הוסתר. לקוחות קיימים ממשיכים לקבל תזכורות עליו' : 'המוצר הוסר'); route(); return;
  }
  if (a==='saveprods'){ if (await saveProducts()){ toast('המוצרים נשמרו'); route(); } return; }
  if (a==='smarttrim'){ runSmartTrim(); return; }
  if (a==='savetrim'){ t.disabled = true; saveTrim(); return; }
  if (a==='canceltrim'){ trimBlob = null; $('#trimBox').hidden = true; return; }
  if (a==='revertvid'){ revertOrig(); return; }
  if (a==='delvideo'){ deleteVideo(); return; }
  if (a==='logout'){ await sb.auth.signOut(); return; }
});
document.addEventListener('keydown', e => { if (e.key==='Escape' && $('#overlayRoot').innerHTML) closeDrawer(); });

/* ---------- router ---------- */
const SHELL_VIEWS = ['today','sale','customers','report','setup'];
function route(){
  if (!S) return;
  const h = (location.hash||'#today').slice(1);
  closeDrawer();
  if (h==='kiosk'){ renderKiosk(); window.scrollTo(0,0); return; }
  $('#full').hidden = true; $('#full').innerHTML=''; $('#shell').hidden = false;
  $('#storeLabel').textContent = S.store.name;
  const v = SHELL_VIEWS.includes(h) ? h : 'today';
  document.querySelectorAll('.tabs a').forEach(a => a.getAttribute('href')==='#'+v ? a.setAttribute('aria-current','page') : a.removeAttribute('aria-current'));
  $('#view').innerHTML = views[v]();
  if (v==='sale'){ const i=$('#saleSearch'); i.addEventListener('input', ()=>saleResults(i.value)); saleResults(''); i.focus(); }
  if (v==='customers'){
    $('#custFilter').addEventListener('input', e => {
      const q = e.target.value.trim(), nq = normPhone(q);
      const rows = S.customers.filter(c => !q || c.name.includes(q) || (c.petName||'').includes(q) || (/\d/.test(q) && c.phone.includes(nq))).map(c=>({c,s:status(c)})).sort((a,b)=>a.s.left-b.s.left);
      $('#custList').innerHTML = rows.map(x=>custRow(x.c,'list')).join('') || '<div class="empty">לא נמצא</div>';
    });
  }
  if (v==='setup'){
    attachVideo($('#vidPrev'), videoURL);
    $('#vidFile').addEventListener('change', e => saveVideoFile(e.target.files[0]));
    const z = $('#vidZone');
    ['dragenter','dragover'].forEach(ev => z.addEventListener(ev, e => { e.preventDefault(); z.classList.add('over'); }));
    ['dragleave','drop'].forEach(ev => z.addEventListener(ev, e => { e.preventDefault(); z.classList.remove('over'); }));
    z.addEventListener('drop', e => saveVideoFile(e.dataTransfer.files[0]));
    $('#storeForm').addEventListener('submit', async e => {
      e.preventDefault();
      const n = $('#sName').value.trim(), w = $('#sWa').value.trim(), tpl = $('#sTpl').value;
      if (n.length < 2){ $('#storeErr').textContent='חסר שם חנות.'; return; }
      if (w && !validPhone(w)){ $('#storeErr').textContent='מספר הוואטסאפ צריך להיות נייד ישראלי, 10 ספרות.'; return; }
      const patch = {name:n, whatsapp: w ? normPhone(w) : null, template:tpl};
      const {error} = await sb.from('stores').update(patch).eq('id', S.store.id);
      if (error){ $('#storeErr').textContent = 'השמירה נכשלה: '+error.message; return; }
      Object.assign(S.store, patch); toast('נשמר'); route();
    });
  }
}
window.addEventListener('hashchange', route);

/* ---------- boot ---------- */
let recovering = false, booting = false;
async function start(){
  if (booting) return; booting = true;
  try { await boot(); } finally { booting = false; }
}
async function boot(){
  if (!sb){ showFull(`<div class="auth"><div class="auth-card"><h1>צריך לחבר את Supabase</h1><p class="sub">פתחו את הקובץ js/config.js ומלאו את כתובת הפרויקט ואת המפתח הציבורי (anon). ההוראות בקובץ README.</p></div></div>`); return; }
  if (recovering) return renderAuth('newpass');
  const {data:{session}} = await sb.auth.getSession();
  if (!session){ S = null; return renderAuth('login'); }
  window.__email = session.user.email;
  showFull('<div class="loading">טוען את החנות…</div>');
  try {
    const {data:store, error} = await sb.from('stores').select('*').maybeSingle();
    if (error) throw error;
    if (!store) return renderOnboarding();
    await loadAll(store);
    $('#logoSlot').innerHTML = LOGO_SVG;
    route();
  } catch(e){
    console.error(e);
    showFull(`<div class="auth"><div class="auth-card"><h1>לא הצלחנו לטעון</h1><p class="sub">${esc(e.message||'')}</p><button class="btn primary" onclick="location.reload()">לנסות שוב</button></div></div>`);
  }
}
if (sb) sb.auth.onAuthStateChange((ev) => {
  if (ev==='PASSWORD_RECOVERY'){ recovering = true; renderAuth('newpass'); }
  else if (ev==='SIGNED_OUT'){ recovering = false; S = null; start(); }
  else if (ev==='SIGNED_IN' && !S && !recovering) start();
});
start();
</script>
