<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>תזכורות לפני שהאוכל נגמר</title>
<meta name="theme-color" content="#0f3a31">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bellefair&family=Heebo:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="app.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="core.js"></script>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} body{margin:0} [hidden]{display:none!important}
.preset{display:grid;gap:2px;padding:14px 16px;border-radius:14px;background:var(--brass-soft)} .preset b{font-size:1.1rem}</style>
</head>
<body>
<div class="join" id="root"><div class="loading">טוען…</div></div>
<script>
const $ = s => document.querySelector(s);
const sb = makeClient();
const qs = new URLSearchParams(location.search);
const slug = (qs.get('s') || '').toLowerCase(), presetPid = qs.get('p'), fromKiosk = qs.get('k') === '1';
const DEFAULT_VIDEO = 'https://videos.pexels.com/video-files/6131732/6131732-hd_1280_720_25fps.mp4';
const kioskUrl = () => location.href.split('?')[0].replace(/join\.html$/, 'index.html') + '#kiosk';
let store = null;

const optionsFor = pet => store.products.filter(p => kindsFor(pet).includes(p.kind)).map(p => `<option value="${p.id}">${esc(p.name)} ${p.kg} ק"ג</option>`).join('');
const everyText = n => ({7:'כל שבוע',14:'כל שבועיים',21:'כל 3 שבועות',30:'כל חודש',42:'כל 6 שבועות',60:'כל חודשיים',90:'כל 3 חודשים',180:'כל חצי שנה',365:'כל שנה'})[n] || 'כל '+n+' ימים';
const rulesFor = pet => store.rules.filter(r => (r.pets||[]).includes(pet));
function rulesHTML(pet){
  const rs = rulesFor(pet); if (!rs.length) return '';
  return `<div class="field"><span class="lbl">רוצה שנזכיר לך גם:</span>${rs.map(r => `<label class="check"><input type="checkbox" data-rule="${r.id}"><span>${esc(r.name)} <span class="hint">(${everyText(r.every)})</span></span></label>`).join('')}</div>`;
}
function page(){
  const vid = videoPublicUrl(sb, store.video_path) || DEFAULT_VIDEO;
  const pp = presetPid ? store.products.find(p => p.id === presetPid) : null;
  const firstPet = pp ? (pp.kind === 'litter' ? 'cat' : pp.kind) : (Object.keys(PETS).find(k => store.products.some(p => kindsFor(k).includes(p.kind))) || 'dog');
  const pets = Object.entries(PETS).filter(([k]) => store.products.some(p => kindsFor(k).includes(p.kind)))
    .map(([k,v]) => `<input type="radio" name="pet" id="pet-${k}" value="${k}" ${k===firstPet?'checked':''}><label for="pet-${k}">${v.label}</label>`).join('');
  document.title = store.name + ' – תזכורות';
  $('#root').innerHTML = `
    ${fromKiosk ? `<a class="back-link" href="${esc(kioskUrl())}">→ חזרה לעמדה</a>` : ''}
    <div class="join-head"><video class="j-video" aria-label="סרטון מהחנות"></video><span class="eyebrow" style="color:#e2c27f">שירות תזכורות אישי</span>
      <h1>${esc(store.name)}</h1><p>נזכיר לך בוואטסאפ כמה ימים לפני שהאוכל נגמר. בלי ספאם, ואפשר להסיר בכל רגע.</p></div>
    <div class="panel" id="body">
      <form class="form" id="f" novalidate>
        <div class="grid2">
          <div class="field"><label for="fName">השם שלך</label><input id="fName" autocomplete="name" required maxlength="60"></div>
          <div class="field"><label for="fPhone">טלפון נייד</label><input id="fPhone" class="num" inputmode="tel" autocomplete="tel" placeholder="05X-XXXXXXX" required></div></div>
        ${pp ? `<div class="preset"><span class="eyebrow">קנית עכשיו</span><b>${esc(pp.name)} ${pp.kg} ק"ג</b></div>` : ''}
        <div class="field" ${pp?'hidden':''}><span class="lbl" id="petLbl">מי אוכל?</span><div class="chips" role="radiogroup" aria-labelledby="petLbl">${pets}</div></div>
        <div class="grid2">
          <div class="field"><label for="fPetName">שם החיה (לא חובה)</label><input id="fPetName" maxlength="40"></div>
          <div class="field"><label for="fDays">בערך כמה ימים מחזיק לך שק?</label><input id="fDays" type="number" min="3" step="1" class="num"><span class="hint">ממולא לפי המוצר. אפשר לשנות.</span></div></div>
        <div class="field" ${pp?'hidden':''}><label for="fProd">איזה מוצר?</label><select id="fProd">${optionsFor(firstPet)}</select></div>
        <label class="check" ${pp?'hidden':''}><input type="checkbox" id="fNow" checked><span>קניתי את זה עכשיו</span></label>
        <div id="fRules">${rulesHTML(firstPet)}</div>
        <label class="check"><input type="checkbox" id="fConsent"><span>אני מאשר/ת לקבל מ${esc(store.name)} תזכורות והצעות בוואטסאפ. אפשר להסיר בכל עת.</span></label>
        <div class="err" id="err" role="alert"></div>
        <button class="btn primary big" type="submit">הירשמו לתזכורות</button>
      </form></div>`;
  const v = $('.j-video'); v.muted = true; v.loop = true; v.playsInline = true; v.autoplay = true; v.onerror = () => v.remove(); v.src = vid; v.play().catch(()=>{});
  const prodOf = id => store.products.find(p => p.id === id);
  if (pp) $('#fProd').value = pp.id;
  const setDays = () => { $('#fDays').value = prodOf($('#fProd').value)?.days || 30; };
  setDays();
  $('#f').addEventListener('change', e => {
    if (e.target.name === 'pet'){ $('#fProd').innerHTML = optionsFor(e.target.value); setDays(); $('#fRules').innerHTML = rulesHTML(e.target.value); }
    if (e.target.id === 'fProd') setDays();
  });
  $('#f').addEventListener('submit', async e => {
    e.preventDefault();
    const err = $('#err'); err.textContent = '';
    const name = $('#fName').value.trim(), phone = normPhone($('#fPhone').value);
    const pet = pp ? (pp.kind === 'litter' ? 'cat' : pp.kind) : document.querySelector('input[name=pet]:checked')?.value;
    const pid = $('#fProd').value, days = Number($('#fDays').value) || null;
    if (!name){ err.textContent = 'חסר שם.'; $('#fName').focus(); return; }
    if (!validPhone(phone)){ err.textContent = 'מספר הטלפון צריך להיות נייד ישראלי, 10 ספרות שמתחילות ב-05.'; $('#fPhone').focus(); return; }
    if (!pid){ err.textContent = 'בחרו מוצר.'; return; }
    if (days !== null && (days < 3 || days > 1000)){ err.textContent = 'מספר הימים צריך להיות בין 3 ל-1000.'; return; }
    if (!$('#fConsent').checked){ err.textContent = 'כדי לקבל תזכורות צריך לסמן אישור.'; return; }
    const rules = [...document.querySelectorAll('[data-rule]:checked')].map(i => i.dataset.rule);
    const btn = e.submitter; if (btn) btn.disabled = true;
    const {data, error} = await sb.rpc('join_store', {p_slug:slug, p_name:name, p_phone:phone, p_pet:pet, p_pet_name:$('#fPetName').value.trim(),
      p_product:pid, p_bought_now: pp ? true : $('#fNow').checked, p_consent:true, p_days:days, p_rules:rules});
    if (btn) btn.disabled = false;
    if (error){ err.textContent = /too many/.test(error.message) ? 'יש עומס כרגע. נסו שוב בעוד כמה דקות.' : 'ההרשמה לא הצליחה. נסו שוב או בקשו עזרה מהמוכר.'; return; }
    const bought = pp || $('#fNow').checked;
    const when = bought ? `לפי החישוב, השק אמור להיגמר בערך ב${fmtLong(addDays(today(), data.days))}. נשלח לך תזכורת כמה ימים לפני.` : 'נשלח לך תזכורת כמה ימים לפני שהשק הבא נגמר.';
    const extra = rules.length ? `<p class="sub">ונזכיר לך גם: ${rules.map(id => esc(store.rules.find(r => r.id===id)?.name||'')).join(', ')}.</p>` : '';
    $('#body').innerHTML = `<div style="display:grid;gap:12px;text-align:center"><h2 style="font-size:1.8rem">נרשמת, ${esc(name.split(' ')[0])}!</h2><p class="sub">${when}</p>${extra}<p class="sub">ההודעות יגיעו מהוואטסאפ של ${esc(store.name)}. כדי להפסיק, פשוט עונים "הסר".</p>
      ${fromKiosk ? `<a class="btn primary" href="${esc(kioskUrl())}">חזרה לעמדה</a>` : ''}</div>`;
    if (fromKiosk) setTimeout(() => { location.href = kioskUrl(); }, 12000);
  });
  if (fromKiosk){ let last = Date.now(); ['pointerdown','keydown','touchstart'].forEach(ev => document.addEventListener(ev, () => last = Date.now(), true)); setInterval(() => { if (Date.now() - last > 60000) location.href = kioskUrl(); }, 5000); }
}
function fatal(msg){ $('#root').innerHTML = `<div class="panel" style="margin-top:40px;text-align:center"><h2>${msg}</h2></div>`; }
(async () => {
  if (!sb) return fatal('הדף עוד לא מחובר.');
  if (!slug) return fatal('הקישור חסר. סרקו שוב את הקוד בחנות.');
  const {data, error} = await sb.rpc('public_store', {p_slug: slug});
  if (error) return fatal('לא הצלחנו לטעון. נסו שוב בעוד רגע.');
  if (!data) return fatal('החנות לא נמצאה. סרקו שוב את הקוד בחנות.');
  store = {...data, products: (data.products||[]).map(p => ({...p, kg:Number(p.kg)})), rules: data.rules || []};
  if (!store.products.length) return fatal('החנות עוד לא הגדירה מוצרים.');
  page();
})();
</script>
</body>
</html>
